services:
  db:
    image: postgres:16-alpine
    container_name: campingsite-db
    environment:
      POSTGRES_DB: soa_dockerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - campingsite_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soa_dockerdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./docker-backend-springboot
    container_name: campingsite-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/soa_dockerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./docker-frontend-reactapp
    container_name: campingsite-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  campingsite_data:
